# Check weekly whether tmux has a release that is newer than our newest
# version directory in `sources`. When this fails, add a version directory;
# see CONTRIBUTING.md.

name: tmux-release

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: bin/check-tmux-release
