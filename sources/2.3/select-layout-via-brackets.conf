##
# Bind [ and ] to some commonly used layouts.
#
# Caution: this replaces two tmux defaults: prefix [ enters copy mode,
# and prefix ] pastes the tmux buffer. If you use copy mode, such as via
# `copy-mode-via-vi-keys.conf`, then don't source this file.
#
# The tmux defaults already include prefix M-1 for even-horizontal and
# prefix M-2 for even-vertical, so our example `tmux.conf` uses those.
##

bind [ select-layout even-horizontal
bind ] select-layout even-vertical
