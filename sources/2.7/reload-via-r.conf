##
# Reload the tmux conf file via prefix r, for tmux 1.9 through 3.1.
#
# This reloads our example `tmux.conf`, which is at
# `~/.config/tmux/tmux.conf`; this is useful when we edit as we go.
#
# For tmux 3.2 and newer, this file reloads whichever conf file tmux
# started with, via `#{config_files}`.
##

bind r source-file ~/.config/tmux/tmux.conf \; display-message 'Config reloaded'
