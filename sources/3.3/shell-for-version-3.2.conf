##
# Shell related settings, for tmux 3.2 and newer.
#
# Use with `shell.conf`.
##

# Enable 24-bit color for terminals that support it.
set -as terminal-features ',xterm*:RGB'

# Reload the tmux conf file that tmux started with, wherever it is,
# such as `~/.tmux.conf` or `~/.config/tmux/tmux.conf`; this is useful
# when we edit as we go.
bind r source-file -F '#{config_files}' \; display 'Config reloaded'
