##
# Pane border lines, for tmux 3.2 and newer.
#
# pane-border-lines can be single, double, heavy, simple, number, or
# padded; tmux 3.6 and newer also accept spaces.
#
# For arrows that point at the active pane, see
# `pane-border-indicators.conf`, for tmux 3.3 and newer.
##

set -g pane-border-lines heavy
