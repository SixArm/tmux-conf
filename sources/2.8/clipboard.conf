##
# Share the system clipboard with programs in panes, via OSC 52.
#
# set-clipboard on: programs can copy to the system clipboard and to a
# tmux buffer. The default is external, which ignores copies from
# programs into tmux buffers. Available in tmux 2.6 and newer.
#
# The outer terminal must support OSC 52 and allow clipboard access; for
# example, iTerm2 needs "Applications in terminal may access clipboard".
#
# For programs that read the clipboard, see `get-clipboard.conf`, for tmux 3.7 and newer.
##

set -g set-clipboard on
