##
# Enable 24-bit color, for tmux 2.2 through 3.1.
#
# This tells tmux that terminals whose TERM matches xterm* support
# 24-bit RGB color, so programs in panes can use it. The `Tc` flag is
# the way to say this before tmux 3.2, which adds `terminal-features`.
##

set -ga terminal-overrides ',xterm*:Tc'
