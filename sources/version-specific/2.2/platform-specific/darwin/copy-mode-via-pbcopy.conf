##
# Copy mode to the macOS clipboard, via `pbcopy`, for tmux 1.9 through 2.3.
#
# Use this after `copy-mode-via-vi-keys.conf`, which it overrides.
#
# Before tmux 2.4, copy mode keys use the `vi-copy` mode key table.
# On macOS before 10.10, `pbcopy` may need the `reattach-to-user-namespace`
# wrapper, such as `copy-pipe "reattach-to-user-namespace pbcopy"`.
##

# In copy mode, y copies the selection to the clipboard and exits.
bind -t vi-copy y copy-pipe "pbcopy"
bind -t vi-copy Enter copy-pipe "pbcopy"
