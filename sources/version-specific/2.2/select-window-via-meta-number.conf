# Shortcuts M-[0-9] to switch to window [0-9].
# These are a bit faster to use than C-b [0-9].
#
# We prefer being able to use M-[0-9] within our editor,
# so we typically do not source these on our own systems.
#
# On macOS, the terminal must send Option as Meta; see
# `platform-specific/darwin/option-is-meta.md`.
#
# With `base-index-pane-number-is-1.conf`, there is no window 0,
# so M-0 selects window 10 instead.

bind -n M-0 select-window -t :10
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9
