##
# Enable extended keys, such as Ctrl-Enter and Shift-Enter, for tmux 3.2
# and newer.
#
# The terminal must also send them: Ghostty, kitty, WezTerm, and foot do
# by default; iTerm2 needs "Report keys using CSI u"; Terminal.app cannot.
#
# Use "on" to send extended keys only to programs that request them,
# or "always" to send them to every program.
#
# To test, run `cat -v` and press Ctrl-Enter: expect `^[[13;5u`, not `^M`.
#
# For the CSI u key format, see `extended-keys-for-version-3.5.conf`.
##

set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
