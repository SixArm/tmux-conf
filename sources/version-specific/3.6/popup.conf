##
# Popup windows, using `display-popup`, for tmux 3.2 and newer.
#
#     prefix T    a scratch shell in the current directory
#     prefix g    lazygit, if it is installed
#
# Close a popup by exiting its program.
#
# For rounded popup borders, see `popup-for-version-3.3.conf`.
##

bind T display-popup -E -w 80% -h 80% -d "#{pane_current_path}"
if-shell 'command -v lazygit' {
  bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit
}
