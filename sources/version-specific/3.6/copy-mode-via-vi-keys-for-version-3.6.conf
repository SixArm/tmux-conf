##
# Copy mode styles, for tmux 3.6 and newer.
#
# Customize the selection colors and the position indicator.
# The tmux defaults work well, so our example `tmux.conf` doesn't
# source this file; source it if you want these styles.
#
# Use with `copy-mode-via-vi-keys.conf`.
##

setw -g copy-mode-selection-style fg=black,bg=yellow
setw -g copy-mode-position-format '#[align=right][#{scroll_position}/#{history_size}]'
