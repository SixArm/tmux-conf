##
# Zoom a pane to fill its window by using prefix +, and unzoom it by
# using prefix -. This is helpful for native mouse copy-paste, which
# tends to work when the item fills the window, but doesn't work when
# the item is in a pane beside other panes.
#
# This uses the built-in zoom, which is available in tmux 1.8 and newer.
# The tmux default prefix z toggles the zoom too.
#
# This replaces the tmux default prefix -, which deletes the newest
# paste buffer.
##

bind + if-shell -F '#{window_zoomed_flag}' '' 'resize-pane -Z'
bind - if-shell -F '#{window_zoomed_flag}' 'resize-pane -Z'
