##
# Copy mode to the macOS clipboard, via `pbcopy`.
#
# Use this after `copy-mode-via-vi-keys.conf`, which it overrides.
##

# In copy mode, y copies the selection to the clipboard and exits.
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"

# In copy mode, finishing a mouse drag copies to the clipboard.
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
