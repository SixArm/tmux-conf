##
# Resize pane similar to vi keybindings, using the shifted keys.
#
# The -r flag makes a key repeatable within `repeat-time`, so we can
# press the prefix once and then tap H H H to keep resizing.
#
# For a longer wait for the first repeat, see
# `initial-repeat-time.conf`, for tmux 3.6 and newer.
##

set -g repeat-time 600

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
