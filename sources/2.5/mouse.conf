##
# Mouse Mode, for tmux 2.2 and newer.
#
# Read about the pros and cons of mouse mode here:
# https://web.archive.org/web/2016/http://tangledhelix.com/blog/2012/07/16/tmux-and-mouse-mode/
#
# In iTerm2, you can temporarily bypass mouse mode by holding option.
# In other terminals, shift typically does the same.
#
# Wheel scrolling, pane selection by click, and pane resize by drag
# are all built-in default mouse bindings in current tmux, so we
# don't need custom wheel bindings.
#
# In tmux 3.8, mouse mode is on by default, so this file states the
# setting explicitly.
#
# See also `focus-follows-mouse.conf`, for tmux 3.7 and newer.
##

set -g mouse on
