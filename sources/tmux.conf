##
# Example tmux.conf that sources our files, for tmux 3.2 and newer.
#
# Copy this file to `~/.tmux.conf`, or `~/.config/tmux/tmux.conf`,
# and copy the other files to `~/.config/tmux`.
#
# For tmux older than 3.2, see the `version-specific` directory.
##

source-file ~/.config/tmux/version.conf
source-file ~/.config/tmux/platform.conf

source-file ~/.config/tmux/prefix-is-control-a.conf
source-file ~/.config/tmux/shell.conf
source-file ~/.config/tmux/mouse.conf
source-file ~/.config/tmux/status.conf
source-file ~/.config/tmux/version-specific/3.2/status-style-is-black-on-white.conf
source-file ~/.config/tmux/base-index-pane-number-is-1.conf
source-file ~/.config/tmux/split-window.conf
source-file ~/.config/tmux/select-pane-via-hjkl.conf
source-file ~/.config/tmux/resize-pane-via-hjkl.conf
source-file ~/.config/tmux/select-layout-via-brackets.conf
source-file ~/.config/tmux/switch-session-via-name.conf
source-file ~/.config/tmux/last-window-via-tab.conf
source-file ~/.config/tmux/copy-mode-via-vi-keys.conf
source-file ~/.config/tmux/aggressive-resize.conf
source-file ~/.config/tmux/allow-passthrough.conf
source-file ~/.config/tmux/popup.conf

# Platform-specific files must come after the files they override.
if-shell 'test "$(uname)" = Darwin' {
  source-file ~/.config/tmux/platform-specific/darwin/tmux.conf
  source-file ~/.config/tmux/platform-specific/darwin/copy-mode-via-pbcopy.conf
  source-file ~/.config/tmux/platform-specific/darwin/paste-via-pbpaste.conf
}
if-shell 'test "$(uname)" = Linux' {
  source-file ~/.config/tmux/platform-specific/linux/tmux.conf
}
