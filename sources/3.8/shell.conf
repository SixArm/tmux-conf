##
# Set the default shell.
#
# To maximize user flexibility,
# use an environment variable:
#
#     set -g default-shell "$SHELL"
#
# To maximize hardcoded security,
# use a fully qualified path to a binary:
#
#     set -g default-shell "/usr/local/bin/zsh"
#
# To maximize convenience,
# use a simple command:
#
#     set -g default-command "bash"
##

# Set the shell to use the env var.
set -g default-shell "$SHELL"

##
# Shell related settings
#
# For a reload key, see `reload-via-r.conf`. For 24-bit color, for tmux
# 2.2 and newer, see `true-color.conf`.
##

# Remember many lines of history in each pane. The tmux default is 2000.
# Each pane keeps its own history, so a very large limit can use a lot of
# memory when there are many panes.
set -g history-limit 100000

# Set the terminal type so colors get rendered correctly.
set -g default-terminal "tmux-256color"

# Pass focus events through to programs such as vim.
set -g focus-events on

# Make the Escape key quick, such as for vi mode in zsh and for vim.
# A small nonzero time avoids garbled keys over slow connections, such
# as ssh, where an escape sequence can arrive split into pieces.
set -s escape-time 10

# ;: Command prompt
bind \; command-prompt
