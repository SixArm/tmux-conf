##
# Use the built-in light and dark themes.
#
# theme can be:
#
#     detect      follow the terminal's light or dark mode (the default)
#     terminal    use the terminal's ANSI colours, like older tmux
#     light       force the light theme
#     dark        force the dark theme
#
# Styles can use theme colours that follow the theme, such as themeblack,
# themewhite, themelightgrey, themedarkgrey, themegreen, themeyellow,
# themered, themeblue, themecyan, and thememagenta. Customize them with
# options such as `dark-theme-green` and `light-theme-green`.
#
# For a status bar that uses theme colours, see
# `status-style-is-black-on-white.conf`.
##

set -g theme detect
