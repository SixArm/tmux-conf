##
# Show a scrollbar at the side of each pane, for tmux 3.6 and newer.
#
# pane-scrollbars can be off, on, or modal (only in copy mode).
#
# For scrollbars that auto-hide, see `pane-scrollbars-auto-hide.conf`, for tmux 3.8 and newer.
##

set -g pane-scrollbars modal
set -g pane-scrollbars-position right
