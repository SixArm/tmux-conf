##
# Copy mode line numbers, for tmux 3.7 and newer.
#
# Show line numbers relative to the cursor, like vim `relativenumber`,
# which helps with counts such as 5j. Other values are off, default,
# absolute, and hybrid.
#
# Use with `copy-mode-via-vi-keys.conf`.
##

setw -g copy-mode-line-numbers relative
