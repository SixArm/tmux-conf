##
# Example tmux.conf that sources our files, for tmux 3.7.
#
# Copy this directory's files into one directory, such as
# `${XDG_CONFIG_HOME:-$HOME/.config}/tmux`. This file finds the other
# files relative to its own location, via `#{d:current_file}`.
#
# More files are available in this directory, such as
# `select-window-via-meta-number.conf` and `status-via-powerline.conf`;
# see the README.
##

# source-file -F '#{d:current_file}/unbind-all-keys.conf'

source-file -F '#{d:current_file}/version.conf'   # store the tmux version in TMUX_VERSION
source-file -F '#{d:current_file}/platform.conf'  # store the platform in TMUX_PLATFORM

source-file -F '#{d:current_file}/prefix-is-control-a.conf'             # prefix is C-a instead of C-b
source-file -F '#{d:current_file}/shell.conf'                           # default shell, history, escape time
source-file -F '#{d:current_file}/true-color.conf'                      # 24-bit color
source-file -F '#{d:current_file}/reload-via-r.conf'                    # prefix r reloads config
source-file -F '#{d:current_file}/mouse.conf'                           # mouse mode on
source-file -F '#{d:current_file}/focus-follows-mouse.conf'             # select a pane by moving the mouse into it
source-file -F '#{d:current_file}/status.conf'                          # status bar layout
source-file -F '#{d:current_file}/status-style-is-black-on-white.conf'  # black-on-white status bar
source-file -F '#{d:current_file}/base-index-pane-number-is-1.conf'     # number windows and panes from 1
source-file -F '#{d:current_file}/split-window.conf'                    # prefix | and _ split in the current directory
source-file -F '#{d:current_file}/select-pane-via-hjkl.conf'            # prefix h j k l select a pane
source-file -F '#{d:current_file}/resize-pane-via-hjkl.conf'            # prefix H J K L resize a pane
source-file -F '#{d:current_file}/initial-repeat-time.conf'             # a longer wait for the first repeat
source-file -F '#{d:current_file}/switch-session-via-name.conf'         # prefix S switches session by name
source-file -F '#{d:current_file}/zoom-via-plus-minus.conf'             # prefix + and - zoom and unzoom a pane
source-file -F '#{d:current_file}/pane-border.conf'                     # heavy pane borders
source-file -F '#{d:current_file}/pane-border-indicators.conf'          # arrows at the active pane
source-file -F '#{d:current_file}/pane-scrollbars.conf'                 # scrollbars beside each pane in copy mode
source-file -F '#{d:current_file}/copy-mode-via-vi-keys.conf'           # vi keys in copy mode: v selects, y copies
source-file -F '#{d:current_file}/copy-mode-line-numbers.conf'          # relative line numbers in copy mode
source-file -F '#{d:current_file}/clipboard.conf'                       # programs can copy to the system clipboard
source-file -F '#{d:current_file}/get-clipboard.conf'                   # programs can read the system clipboard
source-file -F '#{d:current_file}/popup.conf'                           # prefix T opens a scratch shell popup
source-file -F '#{d:current_file}/popup-border-lines.conf'              # rounded popup borders
source-file -F '#{d:current_file}/aggressive-resize.conf'               # size windows to the smallest viewing client
source-file -F '#{d:current_file}/allow-passthrough.conf'               # let programs send escapes to the terminal
source-file -F '#{d:current_file}/hyperlinks.conf'                      # clickable OSC 8 hyperlinks
source-file -F '#{d:current_file}/extended-keys.conf'                   # extended keys such as Ctrl-Enter
source-file -F '#{d:current_file}/extended-keys-format.conf'            # extended keys in CSI u format

# Platform-specific files must come after the files they override.
if-shell 'test "$(uname)" = Darwin' {
  source-file -F '#{d:current_file}/platform-specific/darwin/tmux.conf'                  # prefix y copies the tmux buffer to the clipboard
  source-file -F '#{d:current_file}/platform-specific/darwin/copy-mode-via-pbcopy.conf'  # copy mode y copies to the clipboard
  source-file -F '#{d:current_file}/platform-specific/darwin/paste-via-pbpaste.conf'     # prefix p pastes the clipboard
}
if-shell 'test "$(uname)" = Linux' {
  source-file -F '#{d:current_file}/platform-specific/linux/tmux.conf'  # placeholder for Linux settings
}
