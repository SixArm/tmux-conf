##
# Example tmux.conf that sources our files, for tmux 2.9.
#
# Copy this directory's files into `~/.config/tmux`, which is where this
# file sources them from. Before tmux 3.1, tmux reads only `~/.tmux.conf`,
# so create `~/.tmux.conf` with this line:
#
#     source-file ~/.config/tmux/tmux.conf
#
# More files are available in this directory, such as
# `select-window-via-meta-number.conf` and `status-via-powerline.conf`;
# see the README.
##

# source-file ~/.config/tmux/unbind-all-keys.conf

source-file ~/.config/tmux/version.conf   # store the tmux version in TMUX_VERSION
source-file ~/.config/tmux/platform.conf  # store the platform in TMUX_PLATFORM

source-file ~/.config/tmux/prefix-is-control-a.conf             # prefix is C-a instead of C-b
source-file ~/.config/tmux/shell.conf                           # default shell, history, escape time
source-file ~/.config/tmux/true-color.conf                      # 24-bit color
source-file ~/.config/tmux/reload-via-r.conf                    # prefix r reloads config
source-file ~/.config/tmux/mouse.conf                           # mouse mode on
source-file ~/.config/tmux/status.conf                          # status bar layout
source-file ~/.config/tmux/status-style-is-black-on-white.conf  # black-on-white status bar
source-file ~/.config/tmux/base-index-pane-number-is-1.conf     # number windows and panes from 1
source-file ~/.config/tmux/split-window.conf                    # prefix | and _ split in the current directory
source-file ~/.config/tmux/select-pane-via-hjkl.conf            # prefix h j k l select a pane
source-file ~/.config/tmux/resize-pane-via-hjkl.conf            # prefix H J K L resize a pane
source-file ~/.config/tmux/switch-session-via-name.conf         # prefix S switches session by name
source-file ~/.config/tmux/zoom-via-plus-minus.conf             # prefix + and - zoom and unzoom a pane
source-file ~/.config/tmux/copy-mode-via-vi-keys.conf           # vi keys in copy mode: v selects, y copies
source-file ~/.config/tmux/clipboard.conf                       # programs can copy to the system clipboard
source-file ~/.config/tmux/aggressive-resize.conf               # size windows to the smallest viewing client

# Platform-specific files must come after the files they override.
# prefix y copies the tmux buffer to the clipboard
if-shell 'test "$(uname)" = Darwin' 'source-file ~/.config/tmux/platform-specific/darwin/tmux.conf'
# copy mode y copies to the clipboard
if-shell 'test "$(uname)" = Darwin' 'source-file ~/.config/tmux/platform-specific/darwin/copy-mode-via-pbcopy.conf'
# prefix p pastes the clipboard
if-shell 'test "$(uname)" = Darwin' 'source-file ~/.config/tmux/platform-specific/darwin/paste-via-pbpaste.conf'
# placeholder for Linux settings
if-shell 'test "$(uname)" = Linux' 'source-file ~/.config/tmux/platform-specific/linux/tmux.conf'
