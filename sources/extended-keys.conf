##
# Enable extended keys, such as Ctrl-Enter and Shift-Enter.
#
# The terminal must also send them: Ghostty, kitty, WezTerm, and foot do
# by default; iTerm2 needs "Report keys using CSI u"; Terminal.app cannot.
#
# Use "on" to send extended keys only to programs that request them,
# or "always" to send them to every program. Available in tmux 3.2 and
# newer; extended-keys-format is available in tmux 3.5 and newer.
#
# To test, run `cat -v` and press Ctrl-Enter: expect `^[[13;5u`, not `^M`.
##

set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'
