##
# Our tmux configurations that are platform-specific for macOS.
#
# This file is sourced by our `tmux.conf` file.
##

# After copying to a tmux buffer, hit y again to copy to clipboard.
#
# Since tmux 2.6, the old `reattach-to-user-namespace` wrapper is not
# needed on modern macOS; `pbcopy` works directly.
bind y run-shell "tmux save-buffer - | pbcopy"

# Let tmux copy to the system clipboard via the terminal, when supported.
set -s set-clipboard on
