##
# Copy mode via vi keys.
#
# Use vi-style keys in copy mode and in the status line prompt:
#
#     prefix [    enter copy mode
#     v           begin selection
#     C-v         toggle rectangle selection
#     y           copy selection and exit copy mode
#
# For copying to the system clipboard, see the platform-specific files,
# such as `platform-specific/darwin/copy-mode-via-pbcopy.conf`.
#
# For newer tmux, see also:
#
#     copy-mode-styles.conf  selection and position styles
#     copy-mode-line-numbers.conf  relative line numbers
#     copy-mode-current-line-style.conf  highlight the cursor line
##

setw -g mode-keys vi
set -g status-keys vi

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
